[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yeptris"
version = "0.6.16.1"
description = "YAML for Python at libleptris speed — an FFI-based (no C extension) binding over libyeptris, PyYAML-compatible"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ribose Inc.", email = "open.source@ribose.com" }]
keywords = ["yaml", "parser", "libyaml", "pyyaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/leptris/yeptris"
Source = "https://github.com/leptris/yeptris-py"

[project.optional-dependencies]
test = ["pytest", "pyyaml"]

[tool.setuptools]
packages = ["yeptris"]
# #108 (leptris-py#158's pattern): compiled wheels carry the engine
# binary (_platform) AND its build inputs (_vendor/engine, grafted at
# wheel-build time) + the rebuild notes. The pure wheel skips the
# graft via the YEPTRIS_PURE gate.
package-data = { yeptris = [
  "py.typed",
  "_platform/*/*",
  "_vendor/*",
  "_vendor/engine/*",
  "_vendor/engine/*/*",
  "_vendor/engine/*/*/*",
  "_vendor/engine/*/*/*/*",
  "_vendor/engine/*/*/*/*/*",
] }

[tool.pytest.ini_options]
testpaths = ["tests"]
