name: Release wheels

# TODO.restructure/42: platform wheels vendoring libyeptris + the
# native JSON engine (abi3 — one wheel per platform, CPython 3.9+).
# Fires on the binding's lockstep tags (v{c-semver}.{patch}); builds
# the C core at the matching C TAG, vendors the shared library into
# yeptris/_platform/<v>/ with a relative rpath, repairs (manylinux)
# or re-tags (macOS floor 11.0), and SMOKES the installed wheel in a
# clean venv before it is attached to the release. PyPI upload rides
# twine from a maintainer machine until trusted publishing is
# configured for this repo (same credentials story as the hand-built
# releases).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # OIDC for PyPI Trusted Publisher

jobs:
  wheel:
    name: Wheel on ${{ matrix.os }}${{ matrix.arch && format(' ({0})', matrix.arch) || '' }}
    runs-on: ${{ matrix.os }}
    # Windows: the DLL rides the wheel (staging + packaging fixed) but
    # the clean-venv ctypes LoadLibrary still TypeErrors on the runner
    # — needs hands-on Windows debugging; non-blocking until then so
    # the platform matrix ships. matrix context only at job level —
    # runner is a step context (the startup-failure lesson)
    continue-on-error: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          # Intel macs: GitHub retired the free x86_64 runners — the
          # Apple toolchain cross-builds on the arm leg instead
          # (the smoke step can't load a cross dylib, so it is skipped)
          - os: macos-latest
            arch: x86_64
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          # Windows (the leptris-py legs): the ctypes ladder vendors
          # yeptris.dll, and the native abi3 accelerator is optional —
          # a pure wheel + the vendored DLL carries full native parse
          # speed; the wheel retags win_amd64 (x64) / win_arm64 (arm).
          - os: windows-latest
          - os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve the lockstep coordinates
        shell: bash
        run: scripts/resolve-version.sh >> "$GITHUB_ENV"

      - name: Checkout libyeptris (the C core, at the tag)
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
          ref: ${{ env.C_TAG }}

      - name: Install build tooling
        shell: bash
        run: |
          python3 -m pip install -q setuptools wheel build auditwheel
          if [ "$(uname -s)" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build >/dev/null; elif [ "$(uname -s)" = "Darwin" ]; then brew install cmake ninja; fi

      - name: Build the C shared library
        shell: bash
        run: |
          ARCH_FLAGS=""
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ARCH_FLAGS="-DCMAKE_OSX_ARCHITECTURES=x86_64"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B libyeptris-src/build -S libyeptris-src \
              -DYEPTRIS_BUILD_TESTING=OFF \
              -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
            cmake --build libyeptris-src/build --config Release
          else
            cmake -B libyeptris-src/build -S libyeptris-src -G Ninja \
              $ARCH_FLAGS \
              -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_TESTING=OFF \
              -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
            cmake --build libyeptris-src/build
          fi

      - name: Build the vendored abi3 wheel
        shell: bash
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            LIB="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
            export MACOSX_DEPLOYMENT_TARGET=11.0
          elif [ "$(uname -s)" = "MINGW"* ] || [ "$RUNNER_OS" = "Windows" ]; then
            # the VS generator stages the DLL under bin/Release
            LIB="$GITHUB_WORKSPACE/libyeptris-src/build/bin/Release/yeptris.dll"
            test -f "$LIB" || LIB="$GITHUB_WORKSPACE/libyeptris-src/build/src/Release/yeptris.dll"
            test -f "$LIB" || LIB="$GITHUB_WORKSPACE/libyeptris-src/build/src/yeptris.dll"
          else
            LIB="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          YEPTRIS_VENDOR=1 YEPTRIS_LIB_PATH="$LIB" \
            YEPTRIS_SRC="$GITHUB_WORKSPACE/libyeptris-src/src" \
            python3 setup.py bdist_wheel --py-limited-api=cp39

      - name: Diagnose the wheel contents (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -la yeptris/_platform/*/ 2>&1 || true
          python3 -m zipfile -l dist/*.whl | grep -i -E "platform|dll" || echo "NO DLL IN WHEEL"
      - name: Finalize (macOS floor tag / manylinux repair / Windows retag)
        shell: bash
        run: |
          mkdir -p dist/final
          if [ "$RUNNER_OS" = "Windows" ]; then
            python3 -m pip install -q wheel
            if [ "$(uname -m)" = "arm64" ] || [ "${{ matrix.os }}" = "windows-11-arm" ]; then
              python3 -m wheel tags --platform-tag win_arm64 --remove dist/*.whl
            else
              python3 -m wheel tags --platform-tag win_amd64 --remove dist/*.whl
            fi
            mv dist/*.whl dist/final/
          elif [ "$(uname -s)" = "Darwin" ]; then
            TAG="macosx_11_0_arm64"
            if [ "${{ matrix.arch }}" = "x86_64" ]; then
              TAG="macosx_11_0_x86_64"
            fi
            python3 -m wheel tags --platform-tag "$TAG" --remove dist/*.whl
            mv dist/*.whl dist/final/
          else
            auditwheel repair dist/*.whl -w dist/final
          fi

      - name: Smoke the installed wheel (clean venv, no env)
        if: matrix.arch != 'x86_64'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/smokevenv"
          # Windows venvs stage under Scripts/, not bin/
          VB="$RUNNER_TEMP/smokevenv/bin"
          [ -d "$VB" ] || VB="$RUNNER_TEMP/smokevenv/Scripts"
          "$VB/pip" install -q dist/final/*.whl
          cd "$RUNNER_TEMP"
          env -u YEPTRIS_LIB_PATH -u YEPTRIS_SRC \
            "$VB/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"

      - name: Attach the wheel to the release
        shell: bash
        run: |
          gh release view "${{ env.PKG_TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ env.PKG_TAG }}" --title "${{ env.PKG_TAG }}" --generate-notes
          gh release upload "${{ env.PKG_TAG }}" dist/final/*.whl --clobber
        env:
          GH_TOKEN: ${{ github.token }}


  # The pure artifacts: the sdist (ext/ + setup.py ride it; builds
  # native only when the env is set) and the pure wheel — the
  # fallback every non-covered platform installs.
  pure:
    name: Pure sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve the lockstep coordinates
        shell: bash
        run: scripts/resolve-version.sh >> "$GITHUB_ENV"
      - name: Build pure artifacts
        run: python3 -m pip install -q build && python3 -m build
      - name: Attach to the release
        shell: bash
        run: |
          gh release view "${{ env.PKG_TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ env.PKG_TAG }}" --title "${{ env.PKG_TAG }}" --generate-notes
          gh release upload "${{ env.PKG_TAG }}" dist/*.tar.gz dist/*py3-none-any*.whl --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # The single PyPI upload (Linux-only: the publish action cannot run
  # on macOS runners). All wheels + the sdist are downloaded from the
  # GitHub release so every platform artifact ships in one upload.
  # musllinux wheels (Alpine): the whole leg rides docker run — JS
  # actions cannot run inside Alpine. The wheel retags to
  # musllinux_1_2_<arch> (the abi3 wheel is arch-portable within the
  # tag); smoke installs + imports inside the same image.
  wheel-musl:
    name: musllinux wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the lockstep coordinates
        shell: bash
        run: scripts/resolve-version.sh >> "$GITHUB_ENV"

      - name: Stage the checkout for the container
        shell: bash
        run: |
          # the container's /work mount is RUNNER_TEMP — the wheel build
          # consumes the staged tree (the workspace itself is not mounted)
          mkdir -p "$RUNNER_TEMP/yeptris-py"
          tar --exclude=.git --exclude=dist --exclude=build -cf - . | tar -xf - -C "$RUNNER_TEMP/yeptris-py"
          test -f "$RUNNER_TEMP/yeptris-py/pyproject.toml"

      - name: Build + smoke the musllinux wheel (Alpine container)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          docker run --rm -v "$RUNNER_TEMP:/work" -w /work python:3.12-alpine sh -c '
            set -eux
            apk add --no-cache build-base bash cmake ninja git
            git config --global --add safe.directory /work
            git clone --quiet --depth 1 https://github.com/leptris/yeptris /work/yeptris-c
            cmake -B /work/yeptris-c/build -S /work/yeptris-c -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_TESTING=OFF \
              -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
            cmake --build /work/yeptris-c/build
            mkdir -p /work/yeptris-py/yeptris/_platform/musl
            cp /work/yeptris-c/build/src/libyeptris.so /work/yeptris-py/yeptris/_platform/musl/
            cd /work/yeptris-py
            python -m pip install -q setuptools wheel build
            # vendor: the wheel must carry the musl lib + native ext
            # (a pure py3-none-any wheel fails the smoke)
            YEPTRIS_VENDOR=1 YEPTRIS_LIB_PATH=/work/yeptris-c/build/src/libyeptris.so \
              YEPTRIS_SRC=/work/yeptris-c/src \
              python setup.py bdist_wheel --py-limited-api=cp39
            python -m wheel tags --platform-tag musllinux_1_2_${{ matrix.arch }} --remove dist/*.whl
            python -m venv /work/venv
            /work/venv/bin/pip install -q --no-index dist/*.whl
            cd /work
            /work/venv/bin/python -c "import yeptris.json as y; print(\"engine:\", y.engine()); import yeptris._native; assert y.engine() == \"native\"; assert yeptris.load(\"a: [1, 2]\") == {\"a\": [1, 2]}; print(\"MUSL SMOKE PASS\")"
          ' || exit 1
          cp "$RUNNER_TEMP/yeptris-py/dist"/*.whl "$RUNNER_TEMP/dist/" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/dist" | head -5

      - name: Attach the musllinux wheels to the release
        shell: bash
        run: |
          # publish uploads what the GitHub release carries — without
          # this the musl wheels never reach PyPI (0.6.7.3's lesson)
          test -n "$(ls "$RUNNER_TEMP/dist"/*.whl 2>/dev/null)" || { echo "no musl wheels"; exit 1; }
          gh release view "${{ env.PKG_TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ env.PKG_TAG }}" --title "${{ env.PKG_TAG }}" --generate-notes
          gh release upload "${{ env.PKG_TAG }}" "$RUNNER_TEMP/dist"/*.whl --clobber
        env:
          GH_TOKEN: ${{ github.token }}


  publish:
    name: Publish to PyPI (Trusted Publisher)
    runs-on: ubuntu-latest
    needs: [wheel, pure, wheel-musl]
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve the lockstep coordinates
        shell: bash
        run: scripts/resolve-version.sh >> "$GITHUB_ENV"
      - name: Download the release artifacts
        run: gh release download "${{ env.PKG_TAG }}" -D dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
